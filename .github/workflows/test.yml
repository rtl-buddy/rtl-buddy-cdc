name: Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/**/*.sv'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/**/*.sv'

jobs:
  # Primary job: install with the [slang] extra so the pyslang-backed
  # frontend tests (tests/test_slang_elaboration.py,
  # tests/test_slang_lowering.py) actually run instead of skipping.
  # Without --extra slang they're ~700 LOC of dead CI weight — see #9.
  pytest:
    name: pytest (with slang) — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies (with [slang] extra)
        run: uv sync --extra slang --group test --python ${{ matrix.python-version }}

      # Pass `--python` to `uv run` too — without it, uv re-resolves the
      # venv against `.python-version` (3.13), wipes the matrix-specific
      # env from the previous step, and ends up running every matrix
      # entry on 3.13 with pyslang silently absent. Surfaced by the
      # coverage gate in #120 / #121.
      - name: Run pytest (with coverage)
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing --cov-fail-under=78

  # Companion job: install WITHOUT the [slang] extra to verify the
  # AGENTS.md "default install stays typer-only" promise. Specifically
  # exercises the install-hint path in tests/test_frontend.py — the two
  # tests skipped by PYSLANG_INSTALLED above run here.
  pytest-no-slang:
    name: pytest (default install, no pyslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies (no extras)
        run: uv sync --group test --python 3.13

      - name: Run pytest
        run: uv run pytest -q

  # Fuzz + sim + fuzz_diff suites. Gated behind ``@pytest.mark.fuzz`` /
  # ``@pytest.mark.sim`` / ``@pytest.mark.fuzz_diff`` and skipped by
  # every other job because they require yosys / iverilog on PATH.
  # The ``fuzz_diff`` selection additionally needs the ``[slang]``
  # extra for the cross-frontend differential oracle (Stage-3 Layer C
  # of rtl-buddy-cdc#221), so this job installs the slang extra
  # alongside the test group.
  #
  # The three selections run separately so the CI summary shows
  # their case counts independently — ``fuzz_diff`` is allowed to
  # run 5–10× slower than ``fuzz`` per rtl-buddy-cdc#221 done-when.
  #
  # Marginal cost: ~30 s for the apt-install + a few seconds per
  # suite (cached by Yosys content hash + iverilog SHA + pyslang
  # version inside the runner). Worth it to catch regressions in
  # the differential harness or sim oracle that would otherwise
  # skip silently in the other jobs.
  fuzz-and-sim:
    name: fuzz + sim oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install yosys + iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | head -1
          iverilog -V | head -1

      - name: Install test + fuzz + slang dependencies
        # The fuzz group pulls in rtl-buddy-xeno (Stage-3 Layer B,
        # rtl-buddy-cdc#221); it's py3.13-only by its own
        # ``requires-python``, matched to this job's --python 3.13.
        # The [slang] extra is needed for the cross-frontend
        # differential oracle (Stage-3 Layer C).
        run: uv sync --extra slang --group test --group fuzz --python 3.13

      - name: Run fuzz suite
        run: uv run pytest -m fuzz -q

      - name: Run fuzz_diff suite (cross-frontend oracle)
        run: uv run pytest -m fuzz_diff -q

      - name: Run fuzz_grammar suite (Stage-4 grammar topologies)
        run: uv run pytest -m fuzz_grammar -q

      - name: Run sim suite
        run: uv run pytest -m sim -q

      - name: Coverage report (fuzz rule firings)
        run: uv run python -m tests.fuzz.coverage
