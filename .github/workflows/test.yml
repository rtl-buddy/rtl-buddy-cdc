name: Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/**/*.sv'
      - 'tests/**/*.sdc'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/**/*.sv'
      - 'tests/**/*.sdc'

jobs:
  # Primary job: install with the [slang] extra so the pyslang-backed
  # frontend tests (tests/test_slang_elaboration.py,
  # tests/test_slang_lowering.py) actually run instead of skipping.
  # Without --extra slang they're ~700 LOC of dead CI weight — see #9.
  pytest:
    name: pytest (with slang) — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies (with [slang] + [hints] extras)
        # [hints] pulls in PyYAML so the reset-hints YAML loader
        # (reset_hints.py) is exercised under coverage instead of
        # skipping — the coverage gate below counts those paths.
        run: uv sync --extra slang --extra hints --group test --python ${{ matrix.python-version }}

      # Pass `--python` to `uv run` too — without it, uv re-resolves the
      # venv against `.python-version` (3.13), wipes the matrix-specific
      # env from the previous step, and ends up running every matrix
      # entry on 3.13 with pyslang silently absent. Surfaced by the
      # coverage gate in #120 / #121.
      #
      # ``--cov-fail-under=90``: the coverage ratchet. Raised from 78
      # once the per-module test sweep (tests/test_cov_*.py) brought
      # the analyzer + frontends + reporter + CLI to ≥90% line+branch.
      # The number is measured WITHOUT yosys/iverilog (the fuzz / sim
      # selections skip in this job), so it reflects exactly what this
      # job exercises — pyslang elaboration, committed-JSON fixtures,
      # and CliRunner-driven flows.
      - name: Run pytest (with coverage)
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing --cov-fail-under=90

  # Companion job: install WITHOUT the [slang] extra to verify the
  # AGENTS.md "default install stays typer-only" promise. Specifically
  # exercises the install-hint path in tests/test_frontend.py — the two
  # tests skipped by PYSLANG_INSTALLED above run here.
  pytest-no-slang:
    name: pytest (default install, no pyslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies (no extras)
        run: uv sync --group test --python 3.13

      - name: Run pytest
        run: uv run pytest -q

  # Fuzz + sim + fuzz_diff suites. Gated behind ``@pytest.mark.fuzz`` /
  # ``@pytest.mark.sim`` / ``@pytest.mark.fuzz_diff`` and skipped by
  # every other job because they require yosys / iverilog on PATH.
  # The ``fuzz_diff`` selection additionally needs the ``[slang]``
  # extra for the cross-frontend differential oracle (Stage-3 Layer C
  # of rtl-buddy-cdc#221), so this job installs the slang extra
  # alongside the test group.
  #
  # The three selections run separately so the CI summary shows
  # their case counts independently — ``fuzz_diff`` is allowed to
  # run 5–10× slower than ``fuzz`` per rtl-buddy-cdc#221 done-when.
  #
  # Marginal cost: ~30 s for the apt-install + a few seconds per
  # suite (cached by Yosys content hash + iverilog SHA + pyslang
  # version inside the runner). Worth it to catch regressions in
  # the differential harness or sim oracle that would otherwise
  # skip silently in the other jobs.
  fuzz-and-sim:
    name: fuzz + sim oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install yosys + iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | head -1
          iverilog -V | head -1

      - name: Install test + fuzz + slang dependencies
        # The fuzz group pulls in rtl-buddy-xeno (Stage-3 Layer B,
        # rtl-buddy-cdc#221). xeno is >=3.11 since rtl-buddy-xeno PR #17,
        # so it resolves on any Python this project supports; this job
        # runs the fuzz/sim suites on a single interpreter (3.13) by
        # choice — the mutation operators are pure Python, not
        # version-sensitive. The [slang] extra is needed for the
        # cross-frontend differential oracle (Stage-3 Layer C).
        run: uv sync --extra slang --group test --group fuzz --python 3.13

      - name: Run fuzz suite
        run: uv run pytest -m fuzz -q

      - name: Run fuzz_diff suite (cross-frontend oracle)
        run: uv run pytest -m fuzz_diff -q

      - name: Run fuzz_grammar suite (Stage-4 grammar topologies)
        run: uv run pytest -m fuzz_grammar -q

      - name: Run sim suite
        run: uv run pytest -m sim -q

      - name: Coverage report (fuzz rule firings)
        run: uv run python -m tests.fuzz.coverage

  # End-to-end exercise of the yosys-slang plugin (`read_slang`) path —
  # the `--yosys-plugin` / RTL_BUDDY_SLANG_PLUGIN flow in cli.py /
  # frontends/yosys.py. Every other job leaves the plugin tests skipped
  # (RTL_BUDDY_SLANG_PLUGIN unset), so without this job the read_slang
  # branch is untested in CI.
  #
  # yosys-slang needs a Yosys in its supported range (0.52–0.65); the
  # distro `apt` Yosys is far older, so we build a pinned Yosys from
  # source (cached by version) the way yosys-slang's own CI does, then
  # build the fork's `build/slang.so` against that Yosys's `yosys-config`
  # (ccache-accelerated, cached by source hash). The test itself
  # (tests/test_yosys_slang_plugin.py) only needs the default install —
  # the read_slang path is a Yosys subprocess, not pyslang — so no
  # `[slang]` extra here.
  yosys-slang-plugin:
    name: yosys-slang plugin (read_slang) oracle
    runs-on: ubuntu-latest
    env:
      # Pinned Yosys release to build the plugin against. Bump only to a
      # version yosys-slang's README lists as supported.
      YOSYS_VERSION: v0.64
      # rtl-buddy fork + branch carrying this project's slang frontend.
      YOSYS_SLANG_REPO: https://github.com/rtl-buddy/yosys-slang.git
      YOSYS_SLANG_REF: rtl-buddy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache pkg-config git \
            bison flex libreadline-dev gawk tcl-dev libffi-dev zlib1g-dev

      - name: Cache Yosys ${{ env.YOSYS_VERSION }}
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: ~/yosys-install
          key: yosys-${{ runner.os }}-${{ env.YOSYS_VERSION }}

      - name: Build Yosys ${{ env.YOSYS_VERSION }}
        if: steps.cache-yosys.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch "${YOSYS_VERSION}" \
            https://github.com/YosysHQ/yosys.git yosys_build
          make -C yosys_build config-gcc
          # ABC is irrelevant to the read_slang -> write_json path and is
          # the slowest part of the build; drop it to keep the job lean.
          echo "ENABLE_ABC := 0" >> yosys_build/Makefile.conf
          make -C yosys_build -j"$(nproc)"
          make -C yosys_build install DESTDIR="$HOME/yosys-install"

      - name: Put Yosys on PATH
        run: echo "$HOME/yosys-install/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify Yosys
        run: |
          yosys -V
          yosys-config --datdir >/dev/null

      - name: Cache plugin ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: yosys-slang-${{ env.YOSYS_SLANG_REF }}-${{ env.YOSYS_VERSION }}-${{ github.sha }}
          restore-keys: |
            yosys-slang-${{ env.YOSYS_SLANG_REF }}-${{ env.YOSYS_VERSION }}-

      - name: Build yosys-slang plugin (rtl-buddy fork @ ${{ env.YOSYS_SLANG_REF }})
        run: |
          git clone --recursive --branch "${YOSYS_SLANG_REF}" \
            "${YOSYS_SLANG_REPO}" yosys-slang-src
          ccache --max-size=2G -z
          make -C yosys-slang-src -j"$(nproc)" \
            CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          test -f yosys-slang-src/build/slang.so
          # Export the built plugin so the gated test (and any rtl_buddy
          # .env-style consumer) resolves it the same way as on a dev box.
          echo "RTL_BUDDY_SLANG_PLUGIN=$PWD/yosys-slang-src/build/slang.so" >> "$GITHUB_ENV"

      - name: Install test dependencies (default install)
        run: uv sync --group test --python 3.13

      - name: Run yosys-slang plugin oracle
        run: uv run --python 3.13 pytest -m yosys_slang -v
