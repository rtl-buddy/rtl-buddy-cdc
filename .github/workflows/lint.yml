name: Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      # Fixture sources, netlists and READMEs feed the fixture-docs
      # drift check below.
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      # Fixture sources, netlists and READMEs feed the fixture-docs
      # drift check below.
      - 'tests/fixtures/**'

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Run Ruff
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Hint — install pre-commit to catch this locally
        if: failure()
        run: |
          echo ""
          echo "Ruff check or format failed. Catch this before pushing by installing the pre-commit hook:"
          echo ""
          echo "  uv tool install pre-commit"
          echo "  pre-commit install"
          echo ""
          echo "After that, every commit will run Ruff automatically."

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Run mypy
        run: uv run mypy

  # Fixture README drift (rtl-buddy-cdc#356). Each README is generated
  # from its fixture's leading SV comment plus a domain map that
  # ``analyze`` renders from the committed netlist, so editing a .sv
  # header or rebuilding a netlist without re-running the generator
  # leaves the README stale. ``--committed-netlists-only`` keeps the check
  # Yosys-free and reproducible: the handful of fixtures with no
  # committed netlist would need Yosys to elaborate, and their README
  # depends on that Yosys's cell naming.
  fixture-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group lint

      - name: Check fixture READMEs are up to date
        run: uv run python scripts/gen_fixture_docs.py --check --committed-netlists-only

      - name: Hint — regenerate the READMEs
        if: failure()
        run: |
          echo ""
          echo "Fixture READMEs are stale. Regenerate them and commit the result:"
          echo ""
          echo "  uv run python scripts/gen_fixture_docs.py"
