# Open-source integration corpus (rtl-buddy-cdc#331).
#
# Real multi-clock designs written by other people, run through the
# analyzer with reviewed, pinned expectations. The upstream RTL is NOT
# vendored: each design names a repository and a full commit SHA, and
# tests/integration/runner.py fetches that commit on demand. The SDC
# files under sdc/, the wrappers under wrappers/ and everything in this
# file are this project's own work.
#
# Licence rule: permissive licences only (MIT, BSD, Apache-2.0, ISC,
# CC0, Solderpad, CERN-OHL-P), checked at the pinned commit. Never
# GPL / LGPL / CERN-OHL-S / unlicensed. `license_file` must exist at the
# pinned commit (the runner checks); when a repository carries no
# top-level licence file, point it at the source file whose header
# grants the licence and say so in `license_note`.
#
# Per design:
#   expect.clocks          SDC clocks that must each reach >= 1 flop
#   expect.crossings       summary.crossings of `analyze` (Yosys path)
#   expect.rules           per-rule fired counts (kept violations)
#   expect.domain_unknown  flops left without a domain (0 unless explained)
#   [[design.finding]]     every fired rule, reviewed: `count` findings
#                          of `rule` classified as one of
#                            true_positive  - a real hazard in the design
#                            false_positive - the design is protected and
#                                             the analyzer should be silent
#                            outside_model  - safe (or unsafe) only by a
#                                             property the structural
#                                             model cannot see (protocol,
#                                             update rate, environment)
#                          `gap` names a [gaps.*] entry when the
#                          analyzer is wrong.
#   [[design.missed]]      findings the analyzer should have produced but
#                          did not (false negatives), with their gap.
#   slang                  `lint --frontend slang` on the same sources:
#                          reads (elaborates at all), matches_yosys (same
#                          crossings + per-rule counts); when it does not
#                          match, the slang verdict is pinned here with
#                          its gap.
#
# The counts were recorded with Yosys 0.64 and pyslang 10.0.0.

schema = 1

# --- Known analyzer gaps -----------------------------------------------------
# Each is pinned (today's behaviour is the expectation) and has a
# minimal, self-written reproducer described in `reproducer`. When the
# analyzer is fixed the affected design's test fails; update its counts,
# drop the finding / missed entry, and remove the gap here.

[gaps.gray-xor-operand-order]
kind = "false_positive"
rules = ["CDC-004"]
summary = """
The structural gray-code recogniser (_is_gray_encoded_source) matches
an $xor whose B operand is the right-shifted A (b ^ (b >> 1)) only.
XOR is commutative; the same encoder written (b >> 1) ^ b is not
recognised, so a correct gray pointer into a multi-bit 2FF synchroniser
reports CDC-004."""
reproducer = """
4-bit binary counter in clk_a; gray <= (bnext >> 1) ^ bnext; gray into a
two-stage 4-bit synchroniser in clk_b (async groups). CDC-004 fires on
both frontends; writing gray <= bnext ^ (bnext >> 1) is clean."""

[gaps.gray-sync-srst]
kind = "false_positive"
rules = ["CDC-004"]
summary = """
_is_multibit_sync_first_stage requires the first stage's Q to be,
lane for lane, another same-clock flop's D. When the synchroniser
stages carry a synchronous reset, Yosys leaves a constant-leg $mux on
each stage's D (the slang path likewise), so the chain is not seen and a
canonical gray pointer reports CDC-004. The single-bit chain walkers
already step over that mux (_srst_mux_data_bit_to_single_bit_flop,
rtl-buddy-cdc#304); the multi-bit first-stage test does not."""
reproducer = """
Canonical gray counter (gray <= bnext ^ (bnext >> 1)) in clk_a into a
two-stage 4-bit synchroniser in clk_b written as `meta <= gray; q <=
meta; if (rst_b) begin meta <= 0; q <= 0; end`. CDC-004 fires on both
frontends; without the synchronous reset it is clean."""

[gaps.rdc001-reset-synchroniser]
kind = "false_positive"
rules = ["RDC-001"]
summary = """
RDC-001 fires on every flop whose async reset comes from a flop in an
asynchronous clock domain, including the flops of a textbook reset
synchroniser (constant-fed head, Q->D chain, shared async reset) that
brings that reset into the destination domain. Only a port-sourced
reset synchroniser is accepted; a reset generated by a register in
another domain cannot be synchronised without an RDC-001 finding on
the synchroniser itself."""
reproducer = """
a_rst_n is a clk_a register (async reset from port rst_n, D=1). Two
clk_b flops form a reset synchroniser: async reset a_rst_n, sync0_n <=
1, sync1_n <= sync0_n. A third clk_b flop uses sync1_n as its async
reset. RDC-001 fires once (on the two synchroniser flops) on both
frontends; nothing should fire."""

[gaps.cdc001-gated-single-bit]
kind = "false_positive"
rules = ["CDC-001"]
summary = """
CDC-004 accepts a multi-bit crossing captured under a synchronised load
enable (_is_gated_bus_crossing). CDC-001 has no such exemption, so a
1-bit payload register captured under the very same enable is reported
as an unsynchronised control crossing (error), while its multi-bit
siblings in the same bundle are accepted. Only (* cdc_handshake *)
silences it."""
reproducer = """
Toggle handshake with ack: clk_a loads an 8-bit data register and a
1-bit flag register (and flips a toggle) only when the ack, synchronised
back into clk_a, equals the toggle; clk_b synchronises the toggle
through three flops and captures both registers when s2 ^ s3. CDC-001
fires on the flag on both frontends; the 8-bit bus is accepted."""

[gaps.slang-concat-lvalue]
kind = "frontend"
rules = []
summary = """
The slang frontend drops any assignment whose target is a concatenation
l-value ({a, b} <= ... / {c, s} = ...): _lvalue_bits has no
ConcatenationExpression case, so the registers it writes vanish from
the netlist. In a clocked block this is silent; in a combinational block
it can surface as a 'procedural block not lowered' warning for the whole
block. Downstream, the liveness pass removes logic that only fed the
dropped registers, so whole synchronisers and crossings disappear (and
CDC-026 can fire on a memory whose pointer crossing was dropped)."""
reproducer = """
A two-flop synchroniser written `always @(posedge clk_b) {q, meta} <=
{meta, a_q};` with a_q a clk_a register: Yosys sees 3 flops and 1
crossing; slang sees 0 flops and 0 crossings and reports PASS with no
diagnostic. Writing the two stages as separate statements makes the
frontends agree. Combinational variant: `always @* {carry, sum} = acc +
inc;` drops the acc register on the slang path."""

# --- Designs -----------------------------------------------------------------

[[design]]
name = "dpretet_async_fifo"
description = """
Clifford Cummings style async FIFO (gray pointers, 2FF pointer
synchronisers, async-read RAM), Verilog-2001, five small modules."""
repo = "https://github.com/dpretet/async_fifo.git"
commit = "606b27ebf9e3c754205d5b6b044c027cd2e84f14"
license = "MIT"
license_file = "LICENSE"
sources = [
  "rtl/async_fifo.v",
  "rtl/sync_r2w.v",
  "rtl/sync_w2r.v",
  "rtl/wptr_full.v",
  "rtl/rptr_empty.v",
  "rtl/fifomem.v",
]
top = "async_fifo"
sdc = "sdc/dpretet_async_fifo.sdc"
expect = { clocks = ["wclk", "rclk"], crossings = 2, rules = { "CDC-004" = 2 } }
slang = { reads = true, matches_yosys = false, crossings = 0, rules = {}, gap = "slang-concat-lvalue" }

[[design.finding]]
rule = "CDC-004"
count = 2
classification = "false_positive"
gap = "gray-xor-operand-order"
reason = """
Both pointer crossings (wptr -> sync_w2r, rptr -> sync_r2w) carry a
gray code: wgraynext = (wbinnext >> 1) ^ wbinnext, registered, into a
two-stage 5-bit synchroniser ({wq2, wq1} <= {wq1, rptr}). That is the
gray-coded multi-bit synchroniser CDC-004 exempts; the recogniser only
misses it because the shifted operand is on the left of the XOR."""

[[design]]
name = "axis_async_fifo"
description = """
AXI4-Stream async FIFO (default parameters: 4096 x 8, tlast + tuser):
gray pointers, synchronous-reset pointer synchronisers, reset
synchronisers both ways, toggle-synchronised status pulses."""
repo = "https://github.com/alexforencich/verilog-axis.git"
commit = "48ff7a7e2ef782cf778d47910cf85835c64b1bce"
license = "MIT"
license_file = "COPYING"
sources = ["rtl/axis_async_fifo.v"]
top = "axis_async_fifo"
sdc = "sdc/axis_async_fifo.sdc"
expect = { clocks = ["s_clk", "m_clk"], crossings = 7, rules = { "CDC-004" = 2 } }
slang = { reads = true, matches_yosys = true }

[[design.finding]]
rule = "CDC-004"
count = 2
classification = "false_positive"
gap = "gray-sync-srst"
reason = """
wr_ptr_gray_reg / rd_ptr_gray_reg are bin2gray(b) = b ^ (b >> 1) of
the next binary pointer, captured by a two-stage 13-bit synchroniser
(*_gray_sync1_reg -> *_gray_sync2_reg). The stages are cleared by the
synchronised local reset (if (rst_sync3) sync1 <= 0; sync2 <= 0), and
that reset mux on sync2.D hides the chain from the first-stage test.
The other five crossings (two reset synchronisers, three toggle-pulse
status synchronisers) are correctly silent."""

[[design]]
name = "axil_cdc"
description = """
AXI-lite clock-domain crossing (read and write channels): per-channel
toggle flags synchronised both ways, payload registers held until the
flag round trip completes."""
repo = "https://github.com/alexforencich/verilog-axi.git"
commit = "516bd5dadc3365b7f9e225d2af8fe0b8d804fe53"
license = "MIT"
license_file = "COPYING"
sources = ["rtl/axil_cdc.v", "rtl/axil_cdc_rd.v", "rtl/axil_cdc_wr.v"]
top = "axil_cdc"
sdc = "sdc/axil_cdc.sdc"
expect = { clocks = ["s_clk", "m_clk"], crossings = 13, rules = {} }
slang = { reads = true, matches_yosys = true }
notes = """
Clean, and correctly so: every multi-bit payload is captured under a
synchronised flag (CDC-004 gated shape) and the sender waits for the
flag to come back (CDC-012 sees the feedback)."""

[[design]]
name = "zipcpu_afifo"
description = """
ZipCPU asynchronous FIFO (default LGFIFO=3, WIDTH=16, NFF=2,
registered reads): gray pointers, packed {sync, cross} synchronisers,
ASYNC_REG-attributed stages, async-read RAM."""
repo = "https://github.com/ZipCPU/wb2axip.git"
commit = "2e8d3bc2d26ddc33d1881022a2a2b9d3f0c16b9b"
license = "Apache-2.0"
license_file = "rtl/afifo.v"
license_note = """
No top-level licence file; README.md 'Licensing' and the header of
every rtl/ file grant Apache-2.0 (a legacy doc/gpl-3.0.pdf is not the
licence of the RTL)."""
sources = ["rtl/afifo.v"]
top = "afifo"
sdc = "sdc/zipcpu_afifo.sdc"
expect = { clocks = ["i_wclk", "i_rclk"], crossings = 2, rules = {} }
slang = { reads = true, matches_yosys = false, crossings = 0, rules = { "CDC-026" = 1 }, gap = "slang-concat-lvalue" }
notes = """
Clean on the Yosys path, as expected for a textbook gray-pointer FIFO.
On the slang path the {wr_rgray, rgray_cross} / {rd_wgray, wgray_cross}
synchroniser assignments are dropped, so both pointer crossings vanish
and CDC-026 (false positive) fires on the RAM: no write-clock crossing
reaches the read address cone any more."""

[[design]]
name = "zipcpu_apbxclk"
description = """
ZipCPU APB clock-domain bridge (default OPT_REGISTERED=0): request /
ack toggles through 2FF synchronisers, reset synchronisers in both
directions, request fields passed through combinationally and held by
the APB protocol."""
repo = "https://github.com/ZipCPU/wb2axip.git"
commit = "2e8d3bc2d26ddc33d1881022a2a2b9d3f0c16b9b"
license = "Apache-2.0"
license_file = "rtl/apbxclk.v"
license_note = "As for zipcpu_afifo: per-file Apache-2.0 headers and README."
sources = ["rtl/apbxclk.v"]
top = "apbxclk"
sdc = "sdc/zipcpu_apbxclk.sdc"
expect = { clocks = ["S_APB_PCLK", "M_APB_PCLK"], crossings = 2, rules = { "CDC-024" = 7, "RDC-001" = 1, "RDC-008" = 1 } }
slang = { reads = true, matches_yosys = false, crossings = 0, rules = { "CDC-024" = 7 }, gap = "slang-concat-lvalue" }

[[design.finding]]
rule = "CDC-024"
count = 7
classification = "outside_model"
reason = """
Five outputs (M_APB_PADDR/PWRITE/PWDATA/PWSTRB/PPROT) are combinational
feed-throughs of the S_APB_* inputs, and two (S_APB_PRDATA,
S_APB_PSLVERR) are launched by M_APB_PCLK registers. Each is stable
whenever its receiver samples it: the APB master holds the request
fields until PREADY, M_APB_PSEL is raised only after the request has
crossed a 2FF synchroniser, and S_APB_PREADY rises only after the ack
has crossed back. The guarantee is the bus protocol at the ports, which
a structural output check cannot see; CDC-024 documents a waiver for
exactly this."""

[[design.finding]]
rule = "RDC-001"
count = 1
classification = "false_positive"
gap = "rdc001-reset-synchroniser"
reason = """
The two flagged flops are {full_reset, full_reset_pipe} <=
{full_reset_pipe, 1'b1} on S_APB_PCLK with async reset M_PRESETn: the
textbook reset synchroniser that brings the M-side reset into the S
domain (async assert, two-flop synchronous deassert)."""

[[design.finding]]
rule = "RDC-008"
count = 1
classification = "outside_model"
reason = """
S_PRESETn resets five S_APB_PCLK flops directly and is synchronised
into M_APB_PCLK ({M_PRESETn, reset_pipe}). RDC-008's asymmetric-intent
heuristic reads that as a missing synchroniser in S_APB_PCLK. The
design assumes S_PRESETn already deasserts synchronously to S_APB_PCLK
(the APB bus reset of the S side), which is an environment property;
the SDC has no way to state it (set_input_delay on the reset port does
not change RDC-008)."""

[[design]]
name = "ptp_clock_cdc"
description = """
PTP time-of-day transfer between clock domains, three clocks (source,
destination, phase-detector sample clock): toggle-synchronised
timestamp capture, 3FF synchronisers, phase/frequency detector."""
repo = "https://github.com/alexforencich/verilog-ethernet.git"
commit = "77320a9471d19c7dd383914bc049e02d9f4f1ffb"
license = "MIT"
license_file = "COPYING"
sources = ["rtl/ptp_clock_cdc.v"]
top = "ptp_clock_cdc"
sdc = "sdc/ptp_clock_cdc.sdc"
expect = { clocks = ["input_clk", "output_clk", "sample_clk"], crossings = 9, rules = { "CDC-001" = 1, "CDC-012" = 3 } }
slang = { reads = true, matches_yosys = false, crossings = 0, rules = {}, gap = "slang-concat-lvalue" }

[[design.finding]]
rule = "CDC-001"
count = 1
classification = "false_positive"
gap = "cdc001-gated-single-bit"
reason = """
src_ts_step_capt_reg -> src_ts_step_sync_reg is the 1-bit member of the
captured timestamp bundle: loaded in input_clk with the 48-bit seconds
and 34-bit nanoseconds registers, captured in output_clk under the same
synchronised toggle edge (src_sync_sync2 ^ src_sync_sync3). The bus
members are accepted as gated; the 1-bit member is protected the same
way."""

[[design.finding]]
rule = "CDC-012"
count = 2
classification = "outside_model"
reason = """
The 48-bit and 34-bit captured timestamps have no acknowledge, but the
source reloads them at most once per 2^LOG_RATE = 8 input_clk cycles
(src_update_reg from a free-running phase counter) and the destination
captures within about three output_clk cycles of the toggle. The hold
is guaranteed by the update rate and the clock ratio, which the
structural rule cannot see; CDC-012 is a warning for this reason."""

[[design.finding]]
rule = "CDC-012"
count = 1
classification = "outside_model"
reason = """
sample_acc_out_reg -> sample_acc_sync_reg (5-bit, sample_clk ->
output_clk) has the same rate-limited, ack-less shape as the two
timestamp crossings above and is reported the same way. It was silent
until rtl-buddy-cdc#369: the payload's data fanin reaches
dest_sync_reg (output_clk) through the phase detector's own
synchroniser, which the feedback walk used to take for an
acknowledge."""

[[design]]
name = "cdc_utils_cc561"
description = """
Cummings' multi-cycle-path formulation with a synchronised enable pulse
(cc561 + sync2_pgen from the fusesoc cdc_utils primitive library),
bound to DW=8 by this repository's wrapper."""
repo = "https://github.com/fusesoc/cdc_utils.git"
commit = "3066ac271ff959ce7eb328798bbda73e5e38be8d"
license = "CC0-1.0"
license_file = "rtl/verilog/cc561.v"
license_note = "No licence file; the header of each rtl/verilog file dedicates it to CC0."
sources = ["rtl/verilog/cc561.v", "rtl/verilog/sync2_pgen.v"]
local_sources = ["wrappers/cc561_top.v"]
top = "cc561_top"
sdc = "sdc/cdc_utils_cc561.sdc"
expect = { clocks = ["aclk", "bclk"], crossings = 2, rules = { "CDC-012" = 1 } }
slang = { reads = true, matches_yosys = true }

[[design.finding]]
rule = "CDC-012"
count = 1
classification = "true_positive"
reason = """
cc561 has no feedback path: adata_r reloads on any aen, so the 8-bit
word is only coherent at bdata if the caller leaves at least the
synchroniser latency (three bclk edges) between aen pulses. The
primitive does not enforce that; the warning names a real obligation
on its user. The enable itself (aen_r toggle -> sync2_pgen 2FF + pulse)
is correctly silent."""
