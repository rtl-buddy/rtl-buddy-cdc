[project]
name = "rtl-buddy-cdc"
version = "0.2.0"
description = "CDC (clock domain crossing) linting tool for RTL designs, with pluggable Yosys or slang (pyslang) frontend; integrates with rtl-buddy."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Loh Zhi-Hern", email = "expsg-hern@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.25.1",
]

[project.optional-dependencies]
# Opt-in elaboration frontend. Installs the pyslang binding so
# `rtl-buddy-cdc lint --frontend slang ...` can elaborate SystemVerilog
# without a Yosys subprocess. Default install stays typer-only — see
# AGENTS.md "Development rules" on runtime dependencies.
#
# Version range: pyslang 10.x is the tested envelope (the CI matrix
# resolves to 10.0.0; uv.lock pins the same). pyslang has had breaking
# API changes across majors (e.g. the diagnostic engine surface and
# attribute lookup paths moved before 10) so we cap below the next
# major. Re-test and widen when bumping. See issue #26.
slang = [
    "pyslang>=10,<11",
]
# Opt-in YAML hints loader (issue #129). `--reset-hints FILE.yaml`
# reads an external file declaring reset-port polarity / synchroniser
# annotations, parallel to the in-RTL `(* reset_polarity *)` /
# `(* reset_sync *)` SV attributes. Default install stays typer-only;
# PyYAML pulls in only when this extra is requested. See AGENTS.md
# "Development rules" for the runtime-dep policy.
hints = [
    "PyYAML>=6.0",
]

[project.scripts]
rtl-buddy-cdc = "rtl_buddy_cdc:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "mypy>=2.1.0",
    "ruff>=0.11.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
# Fuzz-corpus mutator dep (Stage-3 Layer B of rtl-buddy-cdc#221).
# Only consumed under @pytest.mark.fuzz inside tests/fuzz/test_mutants.py;
# the analyzer's runtime closure stays unchanged. xeno relaxed its
# floor to >=3.11 (rtl-buddy-xeno PR #17) to match this project, so the
# fuzz dep no longer needs a Python marker — it now resolves on every
# pytest-with-slang matrix entry (py3.11 / py3.12 / py3.13). Source
# pinned via [tool.uv.sources] to a content-addressed commit until xeno
# reaches PyPI.
fuzz = [
    # ``[verible,slang]`` extras pull in xeno's verible-CST helpers and
    # pyslang elaborator — required for the three structural CDC
    # operators (``SYNC_CHAIN_DEPTH_PERTURB`` /
    # ``BIT_EXTRACT_PERMUTE`` / ``RESET_POLARITY_FLIP``) to emit any
    # mutants. Without them only the parser-free
    # ``CLOCK_POLARITY_SWAP`` / ``ATTRIBUTE_TOGGLE`` operators fire,
    # and the ≥10-mutants-per-template target in
    # rtl-buddy-cdc#221 done-when criterion 4 misses on every gap
    # family whose source has few ``posedge``/``negedge`` sites.
    "rtl-buddy-xeno[verible,slang]",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# mypy — see issue #28. The job runs in CI as `uv run mypy src/`.
# Scope: src/ only for now (tests/ is a follow-up). Lax baseline —
# we're using mypy as a drift sentinel, not as a forcing function
# to fully annotate every helper. Strict-optional / disallow-untyped
# adoption is incremental.
[tool.mypy]
python_version = "3.11"
files = ["src/rtl_buddy_cdc"]
# pyslang ships .pyi stubs but they fail mypy's parser
# (auto-generated; SyntaxError inside the file). Treat the module as
# Any to keep the rest of the slang frontend checkable. Re-evaluate
# after a pyslang release that fixes the stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyslang.*"
ignore_missing_imports = true
follow_imports = "skip"

# Coverage — see issue #120. Visibility-only; no fail_under gate
# (drift-sentinel posture, same as the mypy job in #28). The CI
# `pytest (with slang)` job runs with `--cov`; the no-slang
# companion stays plain pytest by design.
[tool.coverage.run]
source = ["src/rtl_buddy_cdc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.uv.sources]
# Pinned to rtl-buddy-xeno main. This commit relaxes requires-python to
# >=3.11 (rtl-buddy-xeno PR #17) so this project's py3.11 / py3.12
# entries can resolve it and the fuzz dep above drops its >=3.13 marker.
# It still carries the CDC rule-id corrections (CLOCK_POLARITY_SWAP
# CDC-006 → CDC-016; ATTRIBUTE_TOGGLE CDC-008 → CDC-010 for
# glitchless_clock_mux) and the reset-edge skip that previously produced
# Yosys-rejected invalid SV — so the prediction-accuracy metric in
# test_mutants.py stays high. xeno is on PyPI now (0.1.0) but we stay on
# git main for these post-0.1.0 corrections; bumping to this rev (post
# xeno #24) also resolves the transitive rtl-buddy-view from PyPI 0.2.1
# instead of the stale v0.2.0 git tag.
rtl-buddy-xeno = { git = "https://github.com/rtl-buddy/rtl-buddy-xeno.git", rev = "6549e36519686fbc27723495c5abb7a20369b5fe" }
